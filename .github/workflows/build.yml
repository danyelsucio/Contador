name: Compilar Contador
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter 3.22.2 con Dart 3.6.1
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.22.2 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH
          
      - name: Verificar version instalada
        run: |
          export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter --version
          dart --version
          
      - name: Flutter pub get
        run: |
          export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter pub get
          
      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: contador-apk
          path: build/app/outputs/flutter-apk/app-release.apk
